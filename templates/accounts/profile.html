{% extends "base.html" %}
{% block content %}
  <h2>Your Profile</h2>
  <p><strong>Username:</strong> {{ user.username }}</p>
  <p><strong>Email:</strong> {{ user.email }}</p>
  <p><strong>Role:</strong> {{ user.role|title }}</p>
  
  <a href="{% url 'profile_edit' %}">Edit Profile</a> | 
  <a href="{% url 'dashboard' %}">Back to Dashboard</a>
{% endblock %}
