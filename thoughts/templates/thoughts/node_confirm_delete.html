{% extends "base.html" %}
{% block content %}
  <h2>Delete Node</h2>
  <p>Are you sure you want to delete "{{ node.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" style="background-color: red; color: white;">Yes, Delete</button>
  </form>
  <p><a href="{% url 'node_list' %}">Cancel</a></p>
{% endblock %}
